# ==============================================================================
# DAY TRIP AI - DEVELOPMENT PROFILE CONFIGURATION (Local MySQL)
# ==============================================================================

# Local MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/daytrip_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Enable formatted SQL logging in development console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Level
logging.level.com.daytripai=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
