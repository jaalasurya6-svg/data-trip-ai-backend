# ==============================================================================
# DAY TRIP AI - PRODUCTION PROFILE CONFIGURATION (Render / Cloud Deployment)
# ==============================================================================

# Server binding for Render (must bind to 0.0.0.0 and listen on dynamic PORT)
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration:
# - If SPRING_DATASOURCE_URL is provided in Render environment variables (Cloud MySQL), it uses MySQL.
# - If NO external database is provided, it falls back to in-memory H2 (MySQL mode) so Render NEVER fails to start!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:daytrip_ai;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Disable verbose SQL in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.com.daytripai=INFO
logging.level.org.springframework.web=INFO
