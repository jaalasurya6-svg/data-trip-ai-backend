# ==============================================================================
# DAY TRIP AI - APPLICATION CONFIGURATION
# ==============================================================================

# Application Meta
spring.application.name=day-trip-ai-backend
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=

# Active Profile (default to prod for zero-config cloud deployments)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Database Configuration:
# - If SPRING_DATASOURCE_URL is supplied (e.g. MySQL on Aiven, TiDB, Render, Clever Cloud), it connects to that DB.
# - If not supplied, it falls back to in-memory H2 (in MySQL mode) so Render starts seamlessly with ZERO configuration!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:daytrip_ai;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Security & JWT Configuration (HS256 256-bit Hex Key)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# External AI Provider Configuration
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.ai.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.api-url=https://api.openai.com/v1/chat/completions
app.ai.timeout-seconds=15

# Weather & Maps Integration Config
app.weather.provider=open-meteo
app.weather.simulation=true
app.maps.provider=mock
