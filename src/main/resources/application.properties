# ==============================================================================
# DAY TRIP AI - APPLICATION CONFIGURATION
# ==============================================================================

# Application Meta
spring.application.name=day-trip-ai-backend
server.port=8080
server.servlet.context-path=

# Active Profile (default to dev)
spring.profiles.active=dev

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/daytrip_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Security & JWT Configuration (HS256 256-bit Hex Key)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# External AI Provider Configuration
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.ai.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.api-url=https://api.openai.com/v1/chat/completions
app.ai.timeout-seconds=15

# Weather & Maps Integration Config
app.weather.provider=open-meteo
app.weather.simulation=true
app.maps.provider=mock
